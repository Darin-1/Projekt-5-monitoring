# Maps hostnames to IPs and SSH credentials.
# Points to Vagrant's auto-generated keys to bypass manual password setup.

[monitoring]
monitor ansible_host=192.168.56.11 ansible_user=vagrant ansible_ssh_private_key_file=/projekt/vagrant/.vagrant/machines/monitor/virtualbox/private_key

[targets]
server1 ansible_host=192.168.56.12 ansible_user=vagrant ansible_ssh_private_key_file=/projekt/vagrant/.vagrant/machines/server1/virtualbox/private_key
server2 ansible_host=192.168.56.13 ansible_user=vagrant ansible_ssh_private_key_file=/projekt/vagrant/.vagrant/machines/server2/virtualbox/private_key