# Maps hostnames to IPs and SSH credentials.
# Points to Vagrant's auto-generated keys to bypass manual password setup.

[monitoring]
monitor ansible_host=192.168.56.11 ansible_user=vagrant ansible_ssh_private_key_file=~/.ssh/monitor_key

[targets]
server1 ansible_host=192.168.56.12 ansible_user=vagrant ansible_ssh_private_key_file=~/.ssh/server1_key
server2 ansible_host=192.168.56.13 ansible_user=vagrant ansible_ssh_private_key_file=~/.ssh/server2_key