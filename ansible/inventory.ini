# Bypasses manual password setup by pointing Ansible to keys generated by Vagrant.

[monitoring]
# "ansible_ssh_private_key_file" sets the login key. It uses the Vagrant key.
# Default SSH prompts for a password. Ansible needs passwordless access, so the key.
monitor ansible_host=192.168.56.11 ansible_user=vagrant ansible_ssh_private_key_file=/project/vagrant/.vagrant/machines/monitor/virtualbox/private_key

[targets]
server1 ansible_host=192.168.56.12 ansible_user=vagrant ansible_ssh_private_key_file=/project/vagrant/.vagrant/machines/server1/virtualbox/private_key
server2 ansible_host=192.168.56.13 ansible_user=vagrant ansible_ssh_private_key_file=/project/vagrant/.vagrant/machines/server2/virtualbox/private_key