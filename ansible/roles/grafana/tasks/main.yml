---
# Installs and starts the Grafana Enterprise server.

# "become" escalates privileges. True runs the task as root.
# False runs as the user. Apt requires root, so yes.
- name: Install Grafana dependencies
  become: yes
  apt:
    name:
      - apt-transport-https
      - software-properties-common
      - wget
    state: present

- name: Add Grafana GPG key
  become: yes
  apt_key:
    url: https://apt.grafana.com/gpg.key
    state: present

- name: Add Grafana repository
  become: yes
  apt_repository:
    repo: deb https://apt.grafana.com stable main
    state: present

- name: Install Grafana Enterprise
  become: yes
  apt:
    name: grafana-enterprise
    state: present
    update_cache: yes

# "enabled" controls startup behavior. True starts the service on boot.
# False requires manual start. Monitoring must survive reboots, so yes.
- name: Start and enable Grafana
  become: yes
  systemd:
    name: grafana-server
    state: started
    enabled: yes