---
# Installs Prometheus and configures it to scrape the target nodes.

# "become" escalates privileges. True runs the task as root.
# False runs as the user. Apt requires root, so yes.
- name: Install Prometheus
  become: yes
  apt:
    name: prometheus
    state: present

# "content" writes strings to a file. It creates the config inline.
# Template uses a separate file. Inline keeps it self-contained, so content.
- name: Configure Prometheus scrape targets
  become: yes
  copy:
    dest: /etc/prometheus/prometheus.yml
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: 'nodes'
          static_configs:
            - targets: {{ prometheus_scrape_targets | to_json }}
  notify: Restart Prometheus

# "enabled" controls startup behavior. True starts the service on boot.
# False requires manual start. Monitoring must survive reboots, so yes.
- name: Start and enable Prometheus
  become: yes
  systemd:
    name: prometheus
    state: started
    enabled: yes