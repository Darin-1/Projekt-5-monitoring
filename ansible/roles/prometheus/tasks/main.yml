---
- name: Installera Prometheus
  become: yes
  apt:
    name: prometheus
    state: present

- name: Konfigurera Prometheus scrape targets
  become: yes
  copy:
    dest: /etc/prometheus/prometheus.yml
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: 'noder'
          static_configs:
            - targets: ['192.168.56.11:9100', '192.168.56.12:9100', '192.168.56.13:9100']

- name: Starta om Prometheus
  become: yes
  systemd:
    name: prometheus
    state: restarted