---
# Separates the monitoring stack from the targets to isolate the metrics database.

vars_files:
  - vars/main.yml

# "hosts" defines the targets. "all" selects every machine.
# A specific group limits the targets. We need metrics from everywhere, so all.
- name: Install Node Exporter on all nodes
  hosts: all
  roles:
    - node_exporter

# "hosts" defines the targets. "monitoring" selects the dedicated node.
# "all" installs the database everywhere. We isolate the metrics, so monitoring.
- name: Install monitoring stack
  hosts: monitoring
  roles:
    - prometheus
    - grafana